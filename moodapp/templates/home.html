<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoodMate Kids!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #FF9A9E, #FECFEF, #A1C4FD, #C2E9FB);
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      color: #333;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 35px;
      text-align: center;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
      border: 6px solid #FFF;
      max-width: 450px;
      width: 90%;
    }
    h1 {
      font-size: 2.8rem;
      margin: 0 0 10px 0;
      color: #FF597B;
      text-shadow: 2px 2px 0px #FFD1D1;
    }
    p {
      font-size: 1.3rem;
      color: #555;
      font-weight: bold;
      margin-bottom: 30px;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .btn {
      display: block;
      padding: 15px 20px;
      border-radius: 25px;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 6px 0px rgba(0, 0, 0, 0.15);
      transition: all 0.2s ease-in-out;
    }
    .btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 0px rgba(0, 0, 0, 0.15);
    }
    .happy { background: #FF597B; }
    .sad { background: #4D96FF; }
    .tired { background: #6BCB77; }
    .motivated { background: #FFB830; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎈 MoodMate 🎨</h1>
    <p>How Are You Feeling Today?</p>
    <div class="btn-container">
      <a href="{% url 'mood_detail' 'happy' %}" class="btn happy">😊 Happy!</a>
      <a href="{% url 'mood_detail' 'sad' %}" class="btn sad">😢 Sad</a>
      <a href="{% url 'mood_detail' 'tired' %}" class="btn tired">😴 Sleepy / Tired</a>
      <a href="{% url 'mood_detail' 'motivated' %}" class="btn motivated">😎 Super Motivated!</a>
    </div>
  </div>
</body>
</html>
